services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: TokoKu_app
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - TokoKu

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: TokoKu_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - TokoKu

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: TokoKu_queue
    command: php artisan queue:work redis --tries=3 --sleep=3
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - TokoKu

  nginx:
    image: nginx:stable-alpine
    container_name: TokoKu_nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - TokoKu

  mysql:
    image: mysql:8.0
    container_name: TokoKu_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - TokoKu

  redis:
    image: redis:alpine
    container_name: TokoKu_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - TokoKu

  node:
    image: node:20-alpine
    container_name: TokoKu_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - TokoKu

networks:
  TokoKu:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
